# The release build runs R8, lint and Compose in one pass; 2 GB caused repeated GC pauses,
# so give the daemon room without starving the 24-core host.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Reuses task-graph state between builds; the largest single win for repeated releases.
org.gradle.configuration-cache=true
org.gradle.daemon=true

# Compile Kotlin inside the daemon so incremental rebuilds skip JVM warm-up.
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2048m

android.useAndroidX=true
android.injected.testOnly=false
android.suppressUnsupportedCompileSdk=CANARY
